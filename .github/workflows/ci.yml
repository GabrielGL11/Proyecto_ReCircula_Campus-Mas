name: CI

# Integración continua (XP): cada cambio se prueba y se compila antes de integrarse.
# Corre en pull requests y en pushes a ramas que no sean main.
# En main lo ejecuta deploy.yml (workflow_call), para no correr las pruebas dos veces.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Rama, etiqueta o commit a probar (vacío = el que disparó el workflow)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Reglas de negocio (fechas, superposición de préstamos, roles). La base de datos se simula.
      - name: Pruebas unitarias
        run: npm test
      # Controladores HTTP con supertest: códigos 200, 400, 401, 403.
      - name: Pruebas HTTP de controladores
        run: npm run test:e2e
      - name: Build
        run: npm run build

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # tsc -b + vite build. No necesita variables de Supabase: solo se leen en el navegador.
      - name: Build
        run: npm run build

  secretos:
    name: Secretos (escaneo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Falla si hay un .env versionado, una sb_secret_, una clave de AWS, una llave privada,
      # un JWT service_role o una cadena postgres:// con contraseña. No imprime el valor hallado.
      - name: Buscar secretos en el repositorio
        run: bash scripts/check-secrets.sh repo
